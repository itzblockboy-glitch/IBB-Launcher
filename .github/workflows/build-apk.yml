name: Build APK

# Builds a real, installable APK on GitHub's runners (they have the Android SDK and network;
# the interactive workspace does not). Push to any branch, or run manually from the Actions tab.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

# The publish step writes build logs/APKs to the ci-artifacts branch, so the token needs write.
permissions:
  contents: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.jvmargs=-Xmx4g'

jobs:
  build:
    name: assembleDebug + unit tests
    # Pinned: ubuntu-latest moves between images; the SDK layout below is stable on 22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          # The runner image ships the SDK; just make sure it is on PATH and tell us what we have.
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "---"
          java -version

      - name: Show NDK
        run: |
          # ndk-build compiles src/main/jni (the PojavLauncher-derived execution layer).
          ls "$ANDROID_HOME/ndk" || true
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          echo "NDK at $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Pipeline self-test (tiny blob)
        run: |
          # Proves the Git Data API publish path works independently of the 85 MB APK, so a
          # failure on the big file can never be confused with a broken publisher.
          head -c 4096 /dev/urandom > publish-probe.bin
          echo "probe ready"

      - name: Fetch prebuilt native libraries
        run: |
          # LWJGL-on-Android, gl4es, OSMesa, OpenAL, freetype, JNA, unpack200 — third-party
          # binaries kept out of git (see tools/fetch_native_libs.sh).
          chmod +x tools/fetch_native_libs.sh
          tools/fetch_native_libs.sh app/src/main/jniLibs
          du -sh app/src/main/jniLibs
          find app/src/main/jniLibs -name '*.so' | wc -l

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface failures as annotations: raw logs are not always retrievable via the API.
            grep -E "^e: |^error: |FAILURE:|> Task .* FAILED" test.log | head -40 | while IFS= read -r line; do
              echo "::error title=compile::$line"
            done
            grep -E "^e: " test.log | wc -l | while IFS= read -r n; do echo "::error title=summary::$n compiler errors"; done
          fi
          exit "$status"

      - name: Build APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |^error: |FAILURE:|> Task .* FAILED|Caused by" build.log | head -40 | while IFS= read -r line; do
              echo "::error title=build::$line"
            done
            echo "::group::tail of build log"
            tail -120 build.log
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Collect artifacts
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in out/*.apk; do
            echo "--- $f"
            "$BT/aapt2" dump badging "$f" 2>/dev/null | head -3 || true
            ls -lh "$f"
          done

      - name: Publish build output to the ci-artifacts branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "publish: pwd=$(pwd) out=$(ls -la out 2>/dev/null | tail -3) apks=$(ls out/*.apk 2>/dev/null | wc -l)"
          # Actions log/artifact blobs live on a CDN that is not reachable from every client, so the
          # build publishes its own log (and, on success, the APK) as files via the Contents API.
          set -e
          mkdir -p publish
          for f in test.log build.log publish-probe.bin; do [ -f "$f" ] && cp "$f" publish/ || true; done
          if [ -d out ]; then
            ls -la out > publish/apk-list.txt || true
            for apk in out/*.apk; do [ -f "$apk" ] && cp "$apk" publish/ || true; done
          fi
          if [ -z "$(ls -A publish)" ]; then echo "nothing to publish"; exit 0; fi
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = "ci-artifacts"
          api = f"https://api.github.com/repos/{repo}"

          def call(method, url, payload=None):
              data = json.dumps(payload).encode() if payload else None
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              if data:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return json.load(response)
              except Exception as exc:                                    # noqa: BLE001
                  print(f"  ! {method} {url} -> {exc}")
                  return None

          # Create the orphan branch on first use.
          if call("GET", f"{api}/git/ref/heads/{branch}") is None:
              head = call("GET", f"{api}/git/ref/heads/{os.environ['GITHUB_REF_NAME']}")
              base = head["object"]["sha"] if head else os.environ["GITHUB_SHA"]
              call("POST", f"{api}/git/refs", {"ref": f"refs/heads/{branch}", "sha": base})
              print(f"created branch {branch}")

          # The Contents API refuses to return files whose JSON/base64 representation
          # exceeds ~100 MB, and the APK with the native layer is ~85 MB, so blobs are
          # written and read through the Git Data API instead (100 MB per blob limit).
          folder = f"build/{os.environ['GITHUB_SHA']}"

          def ensure_branch():
              if call("GET", f"{api}/git/ref/heads/{branch}") is not None:
                  return True
              head = call("GET", f"{api}/git/ref/heads/{os.environ['GITHUB_REF_NAME']}")
              base = head["object"]["sha"] if head else os.environ["GITHUB_SHA"]
              call("POST", f"{api}/git/refs", {"ref": f"refs/heads/{branch}", "sha": base})
              print(f"created branch {branch}")
              return True

          def publish_file(path):
              size = path.stat().st_size
              # Hard API limit is 100 MB per blob.
              if size > 95 * 1024 * 1024:
                  print(f"  skip {path.name}: {size} bytes exceeds the blob limit")
                  return
              blob = call(
                  "POST",
                  f"{api}/git/blobs",
                  {"content": base64.b64encode(path.read_bytes()).decode(), "encoding": "base64"},
              )
              if not blob:
                  print(f"  FAILED {path.name}")
                  return
              head = call("GET", f"{api}/git/ref/heads/{branch}")
              head_sha = head["object"]["sha"]
              base_commit = call("GET", f"{api}/git/commits/{head_sha}")
              base_tree = base_commit["tree"]["sha"]
              new_tree = call(
                  "POST",
                  f"{api}/git/trees",
                  {"base_tree": base_tree, "tree": [{"path": f"{folder}/{path.name}", "mode": "100644", "type": "blob", "sha": blob["sha"]}]},
              )
              if not new_tree:
                  print(f"  FAILED tree for {path.name}")
                  return
              commit = call(
                  "POST",
                  f"{api}/git/commits",
                  {"message": f"ci: publish {path.name}", "tree": new_tree["sha"], "parents": [head_sha]},
              )
              if not commit:
                  print(f"  FAILED commit for {path.name}")
                  return
              ok = call("PATCH", f"{api}/git/refs/heads/{branch}", {"sha": commit["sha"]})
              print(f"  {'ok ' if ok else 'FAILED'} {folder}/{path.name} ({size} bytes)")

          ensure_branch()
          # Small files first, then the APKs: a failure on a 67-85 MB blob must not hide the logs.
          everything = sorted(pathlib.Path("publish").iterdir(), key=lambda p: p.stat().st_size)
          for path in everything:
              print(f"publishing {path.name} ({path.stat().st_size} bytes)")
              publish_file(path)
          print("publish complete")
          PY

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ibb-launcher-apk
          path: out/*.apk
          retention-days: 90
          if-no-files-found: error

      # Runs only for `v*` tags: turns the build into a downloadable GitHub Release. This is the
      # only reliable way to get binaries out of Actions from behind a restrictive network, because
      # release assets are served from github.com, not the artifact CDN.
      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ( cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )
          # `gh release view` fails when the release does not exist yet; create it in that case so a
          # fresh tag always produces a downloadable build.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "IBB Launcher $GITHUB_REF_NAME" \
              --notes "Automated build of $GITHUB_SHA. See artifacts/INSTALL.md in the repository for install and native-layer notes."
          for f in out/*.apk out/SHA256SUMS.txt; do
            echo "uploading $f"
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          done
