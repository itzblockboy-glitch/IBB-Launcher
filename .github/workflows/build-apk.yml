name: Build APK

# Builds a real, installable APK on GitHub's runners (they have the Android SDK and network;
# the interactive workspace does not). Push to any branch, or run manually from the Actions tab.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dorg.gradle.jvmargs=-Xmx4g'

jobs:
  build:
    name: assembleDebug + unit tests
    # Pinned: ubuntu-latest moves between images; the SDK layout below is stable on 22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: |
          # The runner image ships the SDK; just make sure it is on PATH and tell us what we have.
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "---"
          java -version

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface failures as annotations: raw logs are not always retrievable via the API.
            grep -E "^(e: |error: |FAILURE|> Task .* FAILED)" test.log | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"

      - name: Build APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^(e: |error: |FAILURE|> Task .* FAILED|Caused by)" build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::group::tail of build log"
            tail -120 build.log
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Collect artifacts
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in out/*.apk; do
            echo "--- $f"
            "$BT/aapt2" dump badging "$f" 2>/dev/null | head -3 || true
            ls -lh "$f"
          done

      - name: Publish build log to the repo (branch: ci-artifacts)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Actions log/artifact blobs are not reachable from every client, so the build
          # publishes its own log as a file in a dedicated branch via the API.
          set -e
          mkdir -p publish
          for f in test.log build.log; do
            [ -f "$f" ] && cp "$f" "publish/$f"
          done
          [ -d out ] && ls -la out > publish/apk-list.txt 2>/dev/null || true
          cd publish
          for f in *; do
            b64=$(base64 -w 0 "$f")
            path="build-logs/${{ github.sha }}/$f"
            sha=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/contents/$path?ref=ci-artifacts" \
              | python3 -c "import sys,json;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
            payload=$(python3 - "$path" "$b64" "$sha" <<'PY'
import json,sys
path,b64,sha=sys.argv[1],sys.argv[2],sys.argv[3] if len(sys.argv)>3 else ""
d={"message":f"ci: build log {path}","content":b64,"branch":"ci-artifacts"}
if sha: d["sha"]=sha
print(json.dumps(d))
PY
)
            curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
              "https://api.github.com/repos/${{ github.repository }}/contents/$path" -d "$payload" > /dev/null || true
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ibb-launcher-apk
          path: out/*.apk
          retention-days: 90
          if-no-files-found: error
