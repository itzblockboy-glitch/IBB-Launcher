name: Build APK

# Builds a real, installable APK on GitHub's runners (they have the Android SDK and network;
# the interactive workspace does not). Push to any branch, or run manually from the Actions tab.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform + build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK (debug-signed when no keystore is configured)
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out
          for f in out/*.apk; do
            echo "--- $f"
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$f" 2>/dev/null | head -4 || true
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ibb-launcher-apk
          path: out/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
